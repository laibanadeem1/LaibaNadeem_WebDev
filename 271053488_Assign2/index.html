<!DOCTYPE html>
<html>
<head>
<title>Meme Generator</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f2f2f2;
    font-family: Impact, "Arial Narrow", sans-serif;
  }

  .meme-container {
    background-color: #000;
    padding: 40px 60px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 600px;
  }

  .meme-image {
    border: 6px solid #fff;
    max-width: 100%;
    max-height: 400px;
    display: block;
  }

  .top-text {
    color: #fff;
    font-size: 42px;
    letter-spacing: 2px;
    margin-top: 30px;
    margin-bottom: 8px;
    text-align: center;
  }

  .bottom-text {
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 15px;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="meme-container">
    <img src="catHacker.jpg" alt="meme image" class="meme-image">
    <div class="top-text">WHEN YOU REALIZE</div>
    <p class="bottom-text">Am I testing my code or is it testing me?</p>
  </div>

</body>
</html>
